name: OP13R Android 6.1 kernel matrix

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: Discard compiler caches and rebuild everything
        required: true
        type: boolean
        default: false
      debug:
        description: Upload diagnostic artifacts
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: op13r-android61-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: OP13R OOS16 Android 14 / 6.1.141
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout matrix
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential clang lld flex bison \
            libelf-dev libssl-dev libncurses-dev zlib1g-dev liblz4-tool \
            libxml2-utils rsync unzip dwarves file python3 ccache jq bc \
            dos2unix kmod libdw-dev elfutils pigz zip patch aria2 cpio

      - name: Prepare proven OP13R OOS16 configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail
          test -f configs/oos16/OP13r-6.1.141.json
          # Preserve the stock OnePlus release suffix from the reviewed config.
          # NostalgiKSU identifies itself through its ABI/version markers, not
          # by changing kernel.release (which would break vendor vermagic).
          JSON=$(jq -c '.susfs=true' configs/oos16/OP13r-6.1.141.json)
          printf 'json=%s\n' "$JSON" >> "$GITHUB_OUTPUT"

      - name: Build OP13R kernel
        id: build
        uses: ./.github/actions/build-kernel
        with:
          op_config_json: ${{ steps.config.outputs.json }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          ksu_type: NostalgiKSU
          susfs_commit_hash_or_branch: ee155a1ad4219804a7c54cb39dd4fa1b5c2a3fa4
          optimize_level: O2
          clean: ${{ inputs.clean_build }}
          debug: ${{ inputs.debug }}

      - name: Verify exact artifact contract
        shell: bash
        env:
          ZIP_NAME: ${{ steps.build.outputs.zip_name }}
        run: |
          set -euo pipefail
          EXPECTED=NOSTALGIC-AK3_OP13r_OOS16_android14-6.1.141_NKSU_33168_SuSFS_v2.3.0.zip
          test "$ZIP_NAME" = "$EXPECTED"
          ZIP_PATH=$(find . -type f -name "$EXPECTED" -print -quit)
          test -n "$ZIP_PATH"
          unzip -p "$ZIP_PATH" anykernel.sh | grep -q '^block=boot$'
          unzip -p "$ZIP_PATH" anykernel.sh | grep -q '^is_slot_device=auto$'
          unzip -p "$ZIP_PATH" anykernel.sh | grep -q '^split_boot$'
          unzip -p "$ZIP_PATH" anykernel.sh | grep -q 'Core stack: NostalgiKSU 33168 + NOSTALGIC SuSFS 2.3.0 GKI-2'
          [ "$(unzip -p "$ZIP_PATH" banner | tr -d '\r\n')" = "NostalgiKSU" ]
          unzip -p "$ZIP_PATH" anykernel.sh | grep -Fq 'AKHOME="$(pwd -P)"'
          unzip -p "$ZIP_PATH" anykernel.sh | grep -q '^magisk_patched=0$'
          ! unzip -p "$ZIP_PATH" banner | grep -qi 'resuki'
          unzip -p "$ZIP_PATH" tools/ak3-core.sh | grep -Fq 'mkdir "$SPLITIMG" || abort'
          ! unzip -p "$ZIP_PATH" tools/ak3-core.sh | grep -Fq 'mkdir -p "$SPLITIMG"'
          ! unzip -p "$ZIP_PATH" anykernel.sh | grep -qiE 'huangdihd|bakasu|resusfs|nomount'
